<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Выгрузка Росздравнадзора</title><style>
:root{font-family:Segoe UI,Arial,sans-serif;color:#172033;background:#f4f6f9}*{box-sizing:border-box}body{margin:0;padding:28px}.card{max-width:960px;margin:auto;background:#fff;border-radius:18px;padding:28px;box-shadow:0 10px 35px #1b2b4b18}h1{margin:0 0 8px;font-size:26px}.sub{color:#667085;margin-bottom:24px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}label{display:block;font-weight:600;font-size:14px;margin-bottom:7px}input{width:100%;padding:12px;border:1px solid #cfd6e4;border-radius:10px;font-size:15px}.names{margin-top:16px}.name-row{display:flex;gap:8px;margin-bottom:8px}.name-row input{flex:1}.add,.remove,button{border:0;border-radius:10px;cursor:pointer;font-weight:700}.add{padding:9px 14px;background:#e7f0fa;color:#0067b8}.remove{width:42px;background:#fbe9e7;color:#b42318}.run{margin-top:14px;background:#0067b8;color:#fff;padding:13px 22px;font-size:15px}.run:disabled{opacity:.55}.progress{height:14px;background:#e7ebf2;border-radius:99px;overflow:hidden;margin-top:22px}.bar{height:100%;width:0;background:#20a464;transition:width .25s}.bar.running{width:75%;animation:pulse 1.2s ease-in-out infinite alternate}@keyframes pulse{from{opacity:.45}to{opacity:1}}.status{margin:8px 0;color:#475467;font-size:14px}.log{height:260px;overflow:auto;background:#0f172a;color:#d6e4ff;border-radius:12px;padding:15px;white-space:pre-wrap;font:13px/1.55 Consolas,Menlo,monospace}.error{color:#b42318}.ok{color:#067647}@media(max-width:720px){body{padding:12px}.card{padding:18px}.grid{grid-template-columns:1fr}}
</style></head><body><main class="card"><h1>Сведения о ЛС, вводимых в гражданский оборот</h1><div class="sub">Тип ЛС: ЛП. Добавьте одно или несколько торговых наименований.</div><div class="grid"><div><label>Дата начала</label><input id="from" type="date"></div><div><label>Дата окончания</label><input id="to" type="date"></div></div><div class="names"><label>Торговые наименования</label><div id="rows"></div><button class="add" id="add" type="button">+ Добавить наименование</button></div><button class="run" id="run" type="button">Выгрузить</button><div class="progress"><div class="bar" id="bar"></div></div><div class="status" id="status">Готово к работе</div><pre class="log" id="log"></pre></main><script>
const rows=document.getElementById('rows'),add=document.getElementById('add'),run=document.getElementById('run'),bar=document.getElementById('bar'),statusEl=document.getElementById('status'),logEl=document.getElementById('log');
function log(x){logEl.textContent+=x+'\n';logEl.scrollTop=logEl.scrollHeight}function addName(value=''){const row=document.createElement('div');row.className='name-row';row.innerHTML='<input type="text" placeholder="Например, Форсига"><button type="button" class="remove">×</button>';row.querySelector('input').value=value;row.querySelector('.remove').onclick=()=>{if(rows.children.length>1)row.remove();else row.querySelector('input').value=''};rows.appendChild(row)}
const today=new Date(),week=new Date(today);week.setDate(today.getDate()-7);const iso=d=>{const x=new Date(d.getTime()-d.getTimezoneOffset()*60000);return x.toISOString().slice(0,10)};document.getElementById('to').value=iso(today);document.getElementById('from').value=iso(week);addName();add.onclick=()=>addName();
run.onclick=async()=>{const names=[...rows.querySelectorAll('input')].map(x=>x.value.trim()).filter(Boolean);if(!names.length){statusEl.innerHTML='<span class="error">Добавьте минимум одно торговое наименование</span>';return}run.disabled=true;bar.classList.add('running');bar.style.width='';logEl.textContent='';statusEl.textContent='Формирование выгрузки...';log('Запуск');log('Наименования: '+names.join(' + '));log('Ожидание ответа Netlify Function...');try{const r=await fetch('/api/export',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({trade_names:names,date_from:document.getElementById('from').value.split('-').reverse().join('.'),date_to:document.getElementById('to').value.split('-').reverse().join('.')})});if(!r.ok){let e;try{e=(await r.json()).error}catch{e=await r.text()}throw new Error(e||('HTTP '+r.status))}const blob=await r.blob();const filename=decodeURIComponent(r.headers.get('X-Filename')||'Росздравнадзор.xlsx');const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),5000);bar.classList.remove('running');bar.style.width='100%';statusEl.innerHTML='<span class="ok">Готово</span>';log('Файл сформирован и передан на скачивание')}catch(e){bar.classList.remove('running');bar.style.width='0%';statusEl.innerHTML='<span class="error">'+e.message+'</span>';log('ОШИБКА: '+e.message)}finally{run.disabled=false}};
</script></body></html>
