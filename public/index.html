<!doctype html>

<html lang="ru">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1"
>

<title>
  Выгрузка Росздравнадзора
</title>

<style>

:root {
  font-family:
    "Segoe UI",
    Arial,
    sans-serif;

  color: #172033;
  background: #f4f6f9;
}


* {
  box-sizing: border-box;
}


body {
  margin: 0;
  padding: 28px;
}


.card {
  max-width: 960px;
  margin: auto;

  background: white;

  border-radius: 18px;

  padding: 28px;

  box-shadow:
    0 10px 35px
    rgba(27, 43, 75, 0.09);
}


h1 {
  margin: 0 0 8px;

  font-size: 26px;
}


.sub {
  color: #667085;

  margin-bottom: 24px;
}


label {
  display: block;

  font-size: 14px;
  font-weight: 600;

  margin-bottom: 7px;
}


/* ==========================
   ДАТЫ
========================== */

.date-section {
  display: flex;

  gap: 14px;

  flex-wrap: wrap;

  margin-bottom: 22px;
}


.date-field {
  width: 175px;
}


input[type="date"] {
  width: 175px;

  padding: 9px 10px;

  border:
    1px solid #cfd6e4;

  border-radius: 9px;

  background: white;

  font:
    14px
    "Segoe UI",
    Arial,
    sans-serif;
}


/* ==========================
   ТОРГОВЫЕ НАИМЕНОВАНИЯ
========================== */

.names-section {
  margin-top: 4px;
}


.name-row {
  display: flex;

  gap: 8px;

  align-items: center;

  max-width: 650px;

  margin-bottom: 8px;
}


.name-row input {
  flex: 1;

  min-width: 220px;

  padding: 11px 12px;

  border:
    1px solid #cfd6e4;

  border-radius: 9px;

  font-size: 15px;
}


button {
  font-family: inherit;

  border: 0;

  border-radius: 9px;

  cursor: pointer;

  font-weight: 700;
}


.add {
  padding: 9px 14px;

  background: #e7f0fa;

  color: #0067b8;
}


.remove {
  width: 40px;
  height: 40px;

  background: #fbe9e7;

  color: #b42318;

  font-size: 19px;
}


/* ==========================
   ACTIONS
========================== */

.actions {
  display: flex;

  gap: 10px;

  align-items: center;

  margin-top: 20px;

  flex-wrap: wrap;
}


.run {
  background: #0067b8;

  color: white;

  padding: 12px 24px;

  font-size: 15px;
}


.run:hover {
  background: #005a9e;
}


.run:disabled {
  opacity: 0.55;

  cursor: not-allowed;
}


.copy {
  display: none;

  background: #e7f0fa;

  color: #0067b8;

  padding: 12px 18px;

  font-size: 14px;
}


.copy:hover {
  background: #d8e8f7;
}


/* ==========================
   PROGRESS
========================== */

.progress {
  height: 12px;

  background: #e7ebf2;

  border-radius: 99px;

  overflow: hidden;

  margin-top: 22px;
}


.bar {
  height: 100%;

  width: 0;

  background: #20a464;
}


.bar.running {
  width: 70%;

  animation:
    pulse
    1.2s
    ease-in-out
    infinite alternate;
}


@keyframes pulse {

  from {
    opacity: 0.35;
  }

  to {
    opacity: 1;
  }
}


.status {
  margin: 8px 0;

  color: #475467;

  font-size: 14px;
}


/* ==========================
   LOG
========================== */

.log-header {
  display: flex;

  justify-content: space-between;

  align-items: center;

  margin-top: 8px;

  margin-bottom: 6px;
}


.log-title {
  font-size: 13px;

  font-weight: 600;

  color: #475467;
}


.log {
  height: 340px;

  overflow: auto;

  background: #0f172a;

  color: #d6e4ff;

  border-radius: 12px;

  padding: 15px;

  white-space: pre-wrap;

  word-break: break-word;

  font:
    13px/1.5
    Consolas,
    Menlo,
    monospace;
}


.error {
  color: #b42318;

  font-weight: 600;
}


.ok {
  color: #067647;

  font-weight: 600;
}


/* ==========================
   MOBILE
========================== */

@media (
  max-width: 620px
) {

  body {
    padding: 12px;
  }


  .card {
    padding: 18px;
  }


  .date-field {
    width: 100%;
  }


  input[type="date"] {
    width: 100%;
  }


  .name-row {
    max-width: 100%;
  }

}

</style>

</head>


<body>


<main class="card">


<h1>
  Сведения о ЛС, вводимых в гражданский оборот
</h1>


<div class="sub">
  Тип ЛС: ЛП.
  Добавьте одно или несколько торговых наименований.
</div>


<section class="date-section">


<div class="date-field">

<label for="date-from">
  Дата начала
</label>

<input
  id="date-from"
  type="date"
>

</div>


<div class="date-field">

<label for="date-to">
  Дата окончания
</label>

<input
  id="date-to"
  type="date"
>

</div>


</section>


<section class="names-section">


<label>
  Торговые наименования
</label>


<div id="name-rows">
</div>


<button
  id="add-name"
  class="add"
  type="button"
>
  + Добавить наименование
</button>


</section>


<div class="actions">


<button
  id="run"
  class="run"
  type="button"
>
  Выгрузить
</button>


<button
  id="copy-log"
  class="copy"
  type="button"
>
  Копировать лог
</button>


</div>


<div class="progress">

<div
  id="progress-bar"
  class="bar"
>
</div>

</div>


<div
  id="status"
  class="status"
>
  Готово к работе
</div>


<div class="log-header">

<span class="log-title">
  Журнал выполнения
</span>

</div>


<pre
  id="log"
  class="log"
></pre>


</main>


<script>

const nameRows =
  document.getElementById(
    "name-rows"
  );


const addButton =
  document.getElementById(
    "add-name"
  );


const runButton =
  document.getElementById(
    "run"
  );


const copyButton =
  document.getElementById(
    "copy-log"
  );


const progressBar =
  document.getElementById(
    "progress-bar"
  );


const statusElement =
  document.getElementById(
    "status"
  );


const logElement =
  document.getElementById(
    "log"
  );


const dateFrom =
  document.getElementById(
    "date-from"
  );


const dateTo =
  document.getElementById(
    "date-to"
  );


/* ==========================
   LOG
========================== */

function addLog(
  message
) {

  const time =
    new Date()
      .toLocaleTimeString();


  logElement.textContent +=
    `[UI ${time}] ${message}\n`;


  logElement.scrollTop =
    logElement.scrollHeight;


  copyButton.style.display =
    "inline-block";
}


function appendServerLog(
  text
) {

  if (!text) {
    return;
  }


  logElement.textContent +=
    "\n\n" +
    "======== SERVER DIAGNOSTICS ========\n" +
    text +
    "\n" +
    "======== END SERVER DIAGNOSTICS ========\n";


  logElement.scrollTop =
    logElement.scrollHeight;


  copyButton.style.display =
    "inline-block";
}


/* ==========================
   COPY
========================== */

copyButton.addEventListener(
  "click",
  async () => {

    const text =
      logElement.textContent;


    if (!text) {
      return;
    }


    try {

      await navigator.clipboard.writeText(
        text
      );


      const oldText =
        copyButton.textContent;


      copyButton.textContent =
        "Скопировано ✓";


      setTimeout(
        () => {

          copyButton.textContent =
            oldText;

        },

        1500
      );


    } catch {

      /*
        Fallback для браузеров,
        блокирующих Clipboard API.
      */

      const textarea =
        document.createElement(
          "textarea"
        );


      textarea.value =
        text;


      textarea.style.position =
        "fixed";


      textarea.style.left =
        "-9999px";


      document.body.appendChild(
        textarea
      );


      textarea.select();


      document.execCommand(
        "copy"
      );


      textarea.remove();


      copyButton.textContent =
        "Скопировано ✓";


      setTimeout(
        () => {

          copyButton.textContent =
            "Копировать лог";

        },

        1500
      );
    }

  }
);


/* ==========================
   DATES
========================== */

function localDateString(
  date
) {

  const adjusted =
    new Date(
      date.getTime() -
      date.getTimezoneOffset() *
      60000
    );


  return adjusted
    .toISOString()
    .slice(0, 10);
}


const today =
  new Date();


const weekAgo =
  new Date(today);


weekAgo.setDate(
  today.getDate() - 7
);


dateTo.value =
  localDateString(
    today
  );


dateFrom.value =
  localDateString(
    weekAgo
  );


/* ==========================
   TRADE NAMES
========================== */

function addNameRow(
  initialValue = ""
) {

  const row =
    document.createElement(
      "div"
    );


  row.className =
    "name-row";


  const input =
    document.createElement(
      "input"
    );


  input.type =
    "text";


  input.placeholder =
    "Например, Форсига";


  input.value =
    initialValue;


  const removeButton =
    document.createElement(
      "button"
    );


  removeButton.type =
    "button";


  removeButton.className =
    "remove";


  removeButton.textContent =
    "×";


  removeButton.addEventListener(
    "click",
    () => {

      if (
        nameRows.children.length >
        1
      ) {

        row.remove();

      } else {

        input.value =
          "";

        input.focus();
      }

    }
  );


  row.appendChild(
    input
  );


  row.appendChild(
    removeButton
  );


  nameRows.appendChild(
    row
  );


  input.focus();
}


addNameRow();


addButton.addEventListener(
  "click",
  () => {

    addNameRow();
  }
);


/* ==========================
   EXPORT
========================== */

runButton.addEventListener(
  "click",
  async () => {

    const names =
      [
        ...nameRows.querySelectorAll(
          "input"
        )
      ]
        .map(
          input =>
            input.value.trim()
        )
        .filter(
          Boolean
        );


    if (!names.length) {

      statusElement.innerHTML =
        '<span class="error">' +
        "Добавьте минимум одно торговое наименование" +
        "</span>";

      return;
    }


    if (
      !dateFrom.value ||
      !dateTo.value
    ) {

      statusElement.innerHTML =
        '<span class="error">' +
        "Укажите обе даты" +
        "</span>";

      return;
    }


    if (
      dateFrom.value >
      dateTo.value
    ) {

      statusElement.innerHTML =
        '<span class="error">' +
        "Дата начала позже даты окончания" +
        "</span>";

      return;
    }


    logElement.textContent =
      "";


    copyButton.style.display =
      "none";


    runButton.disabled =
      true;


    progressBar.classList.add(
      "running"
    );


    progressBar.style.width =
      "";


    statusElement.textContent =
      "Формирование выгрузки...";


    addLog(
      "Запуск выгрузки"
    );


    addLog(
      "Наименования: " +
      names.join(" + ")
    );


    addLog(
      "Период: " +
      dateFrom.value +
      " — " +
      dateTo.value
    );


    const convertDate =
      value =>
        value
          .split("-")
          .reverse()
          .join(".");


    const requestBody = {

      trade_names:
        names,

      date_from:
        convertDate(
          dateFrom.value
        ),

      date_to:
        convertDate(
          dateTo.value
        )
    };


    addLog(
      "POST /api/export"
    );


    try {

      const response =
        await fetch(
          "/api/export",
          {

            method:
              "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body:
              JSON.stringify(
                requestBody
              )
          }
        );


      addLog(
        "HTTP " +
        response.status
      );


      if (!response.ok) {

        /*
          ВАЖНО:
          error response читается только один раз.
        */

        const responseText =
          await response.text();


        addLog(
          "Получен ответ с ошибкой"
        );


        let errorData;


        try {

          errorData =
            JSON.parse(
              responseText
            );

        } catch {

          errorData = {
            error:
              responseText
          };
        }


        if (
          errorData.invocation_id
        ) {

          addLog(
            "Invocation ID: " +
            errorData.invocation_id
          );
        }


        if (
          errorData.diagnostic_log
        ) {

          appendServerLog(
            errorData.diagnostic_log
          );
        }


        throw new Error(
          errorData.error ||
          (
            "HTTP " +
            response.status
          )
        );
      }


      addLog(
        "Получен успешный ответ"
      );


      const blob =
        await response.blob();


      addLog(
        "Размер XLSX: " +
        blob.size +
        " bytes"
      );


      const headerFilename =
        response.headers.get(
          "X-Filename"
        );


      const filename =
        headerFilename
          ? decodeURIComponent(
              headerFilename
            )
          : "Росздравнадзор.xlsx";


      const url =
        URL.createObjectURL(
          blob
        );


      const anchor =
        document.createElement(
          "a"
        );


      anchor.href =
        url;


      anchor.download =
        filename;


      document.body.appendChild(
        anchor
      );


      anchor.click();


      anchor.remove();


      setTimeout(
        () =>
          URL.revokeObjectURL(
            url
          ),

        5000
      );


      progressBar.classList.remove(
        "running"
      );


      progressBar.style.width =
        "100%";


      statusElement.innerHTML =
        '<span class="ok">' +
        "Готово" +
        "</span>";


      addLog(
        "Файл передан на скачивание: " +
        filename
      );


    } catch (error) {

      progressBar.classList.remove(
        "running"
      );


      progressBar.style.width =
        "0%";


      statusElement.innerHTML =
        '<span class="error">' +
        error.message +
        "</span>";


      addLog(
        "ОШИБКА: " +
        error.message
      );


    } finally {

      runButton.disabled =
        false;
    }

  }
);

</script>


</body>

</html>
