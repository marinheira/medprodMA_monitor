<!doctype html>

<html lang="ru">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1"
>

<title>
  Выгрузка Росздравнадзора
</title>

<style>

:root {
  font-family:
    "Segoe UI",
    Arial,
    sans-serif;

  color: #172033;

  background: #f4f6f9;
}


* {
  box-sizing: border-box;
}


body {
  margin: 0;
  padding: 28px;
}


.card {
  max-width: 960px;

  margin: auto;

  background: #ffffff;

  border-radius: 18px;

  padding: 28px;

  box-shadow:
    0 10px 35px
    rgba(27, 43, 75, 0.09);
}


h1 {
  margin:
    0 0 8px;

  font-size: 26px;
}


.sub {
  color: #667085;

  margin-bottom: 24px;
}


/* -----------------------------
   ДАТЫ
------------------------------ */

.date-section {
  display: flex;

  align-items: end;

  gap: 16px;

  flex-wrap: wrap;

  margin-bottom: 22px;
}


.date-field {
  width: 190px;
}


label {
  display: block;

  font-weight: 600;

  font-size: 14px;

  margin-bottom: 7px;
}


input {
  font-family: inherit;

  font-size: 15px;
}


input[type="date"] {
  width: 190px;

  padding: 10px 11px;

  border:
    1px solid #cfd6e4;

  border-radius: 9px;

  background: #ffffff;
}


/* -----------------------------
   ТОРГОВЫЕ НАИМЕНОВАНИЯ
------------------------------ */

.names-section {
  margin-top: 4px;
}


.name-row {
  display: flex;

  gap: 8px;

  align-items: center;

  margin-bottom: 8px;

  max-width: 650px;
}


.name-row input {
  flex: 1;

  min-width: 220px;

  padding: 11px 12px;

  border:
    1px solid #cfd6e4;

  border-radius: 9px;
}


button {
  font-family: inherit;

  border: 0;

  border-radius: 9px;

  cursor: pointer;

  font-weight: 700;
}


.add {
  padding:
    9px 14px;

  background: #e7f0fa;

  color: #0067b8;

  margin-top: 2px;
}


.remove {
  width: 40px;

  height: 40px;

  flex: 0 0 40px;

  background: #fbe9e7;

  color: #b42318;

  font-size: 19px;
}


.run {
  margin-top: 20px;

  background: #0067b8;

  color: #ffffff;

  padding:
    12px 24px;

  font-size: 15px;
}


.run:hover {
  background: #005a9e;
}


.run:disabled {
  opacity: 0.55;

  cursor: not-allowed;
}


/* -----------------------------
   ПРОГРЕСС
------------------------------ */

.progress {
  height: 12px;

  background: #e7ebf2;

  border-radius: 99px;

  overflow: hidden;

  margin-top: 24px;
}


.bar {
  height: 100%;

  width: 0;

  background: #20a464;

  transition:
    width 0.25s;
}


/*
  На Netlify Function мы не можем получать
  реальный прогресс внутри одного запроса,
  поэтому показываем indeterminate progress.
*/

.bar.running {
  width: 70%;

  animation:
    pulse 1.2s
    ease-in-out
    infinite alternate;
}


@keyframes pulse {

  from {
    opacity: 0.35;
  }

  to {
    opacity: 1;
  }
}


.status {
  margin:
    8px 0;

  color: #475467;

  font-size: 14px;
}


/* -----------------------------
   LOG
------------------------------ */

.log {
  height: 240px;

  overflow: auto;

  background: #0f172a;

  color: #d6e4ff;

  border-radius: 12px;

  padding: 15px;

  white-space: pre-wrap;

  word-break: break-word;

  font:
    13px/1.55
    Consolas,
    Menlo,
    monospace;
}


.error {
  color: #b42318;

  font-weight: 600;
}


.ok {
  color: #067647;

  font-weight: 600;
}


/* -----------------------------
   MOBILE
------------------------------ */

@media (
  max-width: 620px
) {

  body {
    padding: 12px;
  }


  .card {
    padding: 18px;
  }


  .date-section {
    gap: 10px;
  }


  .date-field {
    width: 100%;
  }


  input[type="date"] {
    width: 100%;
  }


  .name-row {
    max-width: 100%;
  }

}

</style>

</head>


<body>


<main class="card">


<h1>
  Сведения о ЛС, вводимых в гражданский оборот
</h1>


<div class="sub">
  Тип ЛС: ЛП.
  Добавьте одно или несколько торговых наименований.
</div>


<section class="date-section">

  <div class="date-field">

    <label for="date-from">
      Дата начала
    </label>

    <input
      id="date-from"
      type="date"
    >

  </div>


  <div class="date-field">

    <label for="date-to">
      Дата окончания
    </label>

    <input
      id="date-to"
      type="date"
    >

  </div>

</section>


<section class="names-section">

  <label>
    Торговые наименования
  </label>


  <div id="name-rows">
  </div>


  <button
    id="add-name"
    class="add"
    type="button"
  >
    + Добавить наименование
  </button>

</section>


<button
  id="run"
  class="run"
  type="button"
>
  Выгрузить
</button>


<div class="progress">

  <div
    id="progress-bar"
    class="bar"
  >
  </div>

</div>


<div
  id="status"
  class="status"
>
  Готово к работе
</div>


<pre
  id="log"
  class="log"
></pre>


</main>


<script>

const nameRows =
  document.getElementById(
    "name-rows"
  );


const addButton =
  document.getElementById(
    "add-name"
  );


const runButton =
  document.getElementById(
    "run"
  );


const progressBar =
  document.getElementById(
    "progress-bar"
  );


const statusElement =
  document.getElementById(
    "status"
  );


const logElement =
  document.getElementById(
    "log"
  );


const dateFrom =
  document.getElementById(
    "date-from"
  );


const dateTo =
  document.getElementById(
    "date-to"
  );


function log(message) {

  const time =
    new Date()
      .toLocaleTimeString();


  logElement.textContent +=
    `[${time}] ${message}\n`;


  logElement.scrollTop =
    logElement.scrollHeight;
}


function formatDate(date) {

  const local =
    new Date(
      date.getTime() -
      date.getTimezoneOffset() *
      60000
    );


  return local
    .toISOString()
    .slice(0, 10);
}


/* -----------------------------
   ДАТЫ ПО УМОЛЧАНИЮ
------------------------------ */

const today =
  new Date();


const weekAgo =
  new Date(today);


weekAgo.setDate(
  today.getDate() - 7
);


dateTo.value =
  formatDate(today);


dateFrom.value =
  formatDate(weekAgo);


/* -----------------------------
   ТОРГОВЫЕ НАИМЕНОВАНИЯ
------------------------------ */

function addNameRow(
  initialValue = ""
) {

  const row =
    document.createElement(
      "div"
    );


  row.className =
    "name-row";


  const input =
    document.createElement(
      "input"
    );


  input.type =
    "text";


  input.placeholder =
    "Например, Форсига";


  input.value =
    initialValue;


  const removeButton =
    document.createElement(
      "button"
    );


  removeButton.type =
    "button";


  removeButton.className =
    "remove";


  removeButton.textContent =
    "×";


  removeButton.title =
    "Удалить";


  removeButton.addEventListener(
    "click",
    () => {

      if (
        nameRows.children.length >
        1
      ) {

        row.remove();

      } else {

        input.value = "";
        input.focus();
      }
    }
  );


  row.appendChild(
    input
  );


  row.appendChild(
    removeButton
  );


  nameRows.appendChild(
    row
  );


  input.focus();
}


addNameRow();


addButton.addEventListener(
  "click",
  () => {

    addNameRow();
  }
);


/* -----------------------------
   ВЫГРУЗКА
------------------------------ */

runButton.addEventListener(
  "click",
  async () => {

    const names =
      [
        ...nameRows.querySelectorAll(
          "input"
        )
      ]
        .map(
          input =>
            input.value.trim()
        )
        .filter(
          Boolean
        );


    if (!names.length) {

      statusElement.innerHTML =
        '<span class="error">' +
        "Добавьте минимум одно " +
        "торговое наименование" +
        "</span>";

      return;
    }


    if (
      !dateFrom.value ||
      !dateTo.value
    ) {

      statusElement.innerHTML =
        '<span class="error">' +
        "Укажите обе даты" +
        "</span>";

      return;
    }


    if (
      dateFrom.value >
      dateTo.value
    ) {

      statusElement.innerHTML =
        '<span class="error">' +
        "Дата начала позже " +
        "даты окончания" +
        "</span>";

      return;
    }


    runButton.disabled =
      true;


    progressBar.classList.add(
      "running"
    );


    progressBar.style.width =
      "";


    logElement.textContent =
      "";


    statusElement.textContent =
      "Формирование выгрузки...";


    log(
      "Запуск"
    );


    log(
      "Наименования: " +
      names.join(" + ")
    );


    log(
      "Период: " +
      dateFrom.value +
      " — " +
      dateTo.value
    );


    log(
      "Отправка запроса " +
      "в Netlify Function..."
    );


    try {

      /*
        Росздравнадзор ожидает даты:
        DD.MM.YYYY

        HTML date возвращает:
        YYYY-MM-DD
      */

      const convertDate =
        (value) =>
          value
            .split("-")
            .reverse()
            .join(".");


      const response =
        await fetch(
          "/api/export",
          {
            method:
              "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body:
              JSON.stringify({
                trade_names:
                  names,

                date_from:
                  convertDate(
                    dateFrom.value
                  ),

                date_to:
                  convertDate(
                    dateTo.value
                  )
              })
          }
        );


      log(
        "Netlify Function: HTTP " +
        response.status
      );


      /*
        Ошибочный ответ читаем как JSON,
        чтобы получить invocation_id.
      */

      if (!response.ok) {

        let errorData;


        try {

          errorData =
            await response.json();

        } catch {

          errorData = {
            error:
              await response.text()
          };
        }


        if (
          errorData.invocation_id
        ) {

          log(
            "Invocation ID: " +
            errorData.invocation_id
          );
        }


        throw new Error(
          errorData.error ||
          (
            "HTTP " +
            response.status
          )
        );
      }


      log(
        "Получен XLSX, " +
        "подготовка скачивания..."
      );


      const blob =
        await response.blob();


      const headerFilename =
        response.headers.get(
          "X-Filename"
        );


      const filename =
        headerFilename
          ? decodeURIComponent(
              headerFilename
            )
          : "Росздравнадзор.xlsx";


      const url =
        URL.createObjectURL(
          blob
        );


      const anchor =
        document.createElement(
          "a"
        );


      anchor.href =
        url;


      anchor.download =
        filename;


      document.body.appendChild(
        anchor
      );


      anchor.click();


      anchor.remove();


      setTimeout(
        () =>
          URL.revokeObjectURL(
            url
          ),

        5000
      );


      progressBar.classList.remove(
        "running"
      );


      progressBar.style.width =
        "100%";


      statusElement.innerHTML =
        '<span class="ok">' +
        "Готово" +
        "</span>";


      log(
        "Файл сформирован."
      );


      log(
        "На скачивание передано: " +
        filename
      );


    } catch (error) {

      progressBar.classList.remove(
        "running"
      );


      progressBar.style.width =
        "0%";


      statusElement.innerHTML =
        '<span class="error">' +
        error.message +
        "</span>";


      log(
        "ОШИБКА: " +
        error.message
      );


    } finally {

      runButton.disabled =
        false;
    }

  }
);

</script>


</body>

</html>
